name: CI

on:
  push:
  pull_request:

jobs:
  apple:
    name: Apple platforms
    # The package needs the iOS 27 SDK, so Xcode 27.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27"
      - name: Test on iOS
        run: >
          xcodebuild test
          -scheme RubyText-Package
          -destination "platform=iOS Simulator,name=iPhone 17 Pro"
      - name: Build for macOS
        run: >
          xcodebuild build
          -scheme RubyText-Package
          -destination "platform=macOS"

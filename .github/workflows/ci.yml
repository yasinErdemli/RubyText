name: CI

on:
  push:
  pull_request:

jobs:
  apple:
    name: Apple platforms
    # The package needs the iOS 27 SDK, so Xcode 27, which GitHub has on
    # its xcode-27 image, a preview of macOS 27, not on macos-26.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"
      - name: Test on iOS
        run: >
          xcodebuild test
          -scheme RubyText-Package
          -destination "platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0"
      - name: Build for macOS
        run: >
          xcodebuild build
          -scheme RubyText-Package
          -destination "platform=macOS"
      - name: Build for visionOS
        run: >
          xcodebuild build
          -scheme RubyText-Package
          -destination "generic/platform=visionOS"
